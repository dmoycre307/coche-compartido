<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coche Compartido - Control de Turnos y Gastos</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'Inter', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 4px;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-nav {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col justify-between overflow-x-hidden select-none">

  <!-- Main Root Container -->
  <div id="root" class="h-full flex flex-col max-w-md mx-auto w-full bg-slate-900 shadow-2xl relative"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const defaultFirebaseConfig = {
      apiKey: "AIzaSyD-demo-key-coche-compartido",
      authDomain: "coche-compartido-app.firebaseapp.com",
      projectId: "coche-compartido-pwa",
      storageBucket: "coche-compartido-pwa.appspot.com",
      messagingSenderId: "1029384756",
      appId: "1:1029384756:web:abcdef123456"
    };

    try {
      const app = initializeApp(defaultFirebaseConfig);
      const db = getFirestore(app);
      window.FirebaseSync = { db, doc, setDoc, onSnapshot, isAvailable: true };
    } catch (e) {
      console.warn("Firebase fall back to local storage mode:", e);
      window.FirebaseSync = { isAvailable: false };
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const INITIAL_MEMBERS = [
      { id: 'm1', name: 'Aurora', active: true, color: 'bg-blue-500' },
      { id: 'm2', name: 'David', active: true, color: 'bg-emerald-500' },
      { id: 'm3', name: 'Germán', active: true, color: 'bg-amber-500' },
      { id: 'm4', name: 'Gustavo', active: true, color: 'bg-purple-500' },
      { id: 'm5', name: 'Mateo', active: true, color: 'bg-rose-500' }
    ];

    const INITIAL_ROUTINES = {
      'Lunes_Ida': [{ id: 'r1', name: 'Trío Lunes', members: ['Aurora', 'Germán', 'David'] }],
      'Lunes_Vuelta': [{ id: 'r2', name: 'Trío Lunes', members: ['Aurora', 'Germán', 'David'] }],
      'Martes_Ida': [{ id: 'r3', name: 'Trío Martes', members: ['Aurora', 'Germán', 'David'] }],
      'Martes_Vuelta': [{ id: 'r4', name: 'Trío Martes', members: ['Aurora', 'Germán', 'David'] }],
      'Miércoles_Ida': [
        { id: 'r5', name: 'Pareja A', members: ['Mateo', 'Aurora'] },
        { id: 'r6', name: 'Pareja B', members: ['David', 'Germán'] }
      ],
      'Miércoles_Vuelta': [
        { id: 'r7', name: 'Pareja A', members: ['Mateo', 'Aurora'] },
        { id: 'r8', name: 'Pareja B', members: ['David', 'Germán'] }
      ],
      'Jueves_Ida': [{ id: 'r9', name: 'Grupo 4 Jueves', members: ['Aurora', 'David', 'Germán', 'Mateo'] }],
      'Jueves_Vuelta': [{ id: 'r10', name: 'Grupo 4 Jueves', members: ['Aurora', 'David', 'Germán', 'Mateo'] }],
      'Viernes_Ida': [{ id: 'r11', name: 'Trío Viernes Ida', members: ['David', 'Germán', 'Mateo'] }],
      'Viernes_Vuelta': [
        { id: 'r12', name: 'Pareja A', members: ['David', 'Germán'] },
        { id: 'r13', name: 'Pareja B', members: ['Mateo', 'Aurora'] }
      ]
    };

    const INITIAL_TRIPS = [
      {
        id: 't_demo_1',
        date: new Date(Date.now() - 86400000 * 2).toISOString().split('T')[0],
        section: 'Ida',
        driver: 'Aurora',
        passengers: ['David', 'Germán', 'Gustavo'],
        createdAt: '08:00'
      },
      {
        id: 't_demo_2',
        date: new Date(Date.now() - 86400000 * 2).toISOString().split('T')[0],
        section: 'Vuelta',
        driver: 'Germán',
        passengers: ['Aurora', 'David', 'Gustavo'],
        createdAt: '17:30'
      }
    ];

    const DAYS_OF_WEEK = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];

    const Toast = ({ message }) => {
      if (!message) return null;
      return (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-sky-600 text-white font-semibold text-xs px-4 py-2.5 rounded-full shadow-2xl animate-bounce flex items-center gap-2 border border-sky-400/60 backdrop-blur-md">
          <i className="fa-solid fa-circle-info text-sky-200"></i>
          <span>{message}</span>
        </div>
      );
    };

    const Header = ({ isMasterUnlocked, syncStatus, groupCode, onOpenSettings, onToggleMaster, onShare }) => {
      return (
        <header className="px-4 py-3 bg-slate-900 border-b border-slate-800/80 flex items-center justify-between shadow-lg shrink-0">
          <div className="flex items-center gap-2.5">
            <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-sky-500/25">
              <i className="fa-solid fa-car-side text-lg"></i>
            </div>
            <div>
              <h1 className="font-bold text-sm leading-tight tracking-tight flex items-center gap-1.5">
                <span>Coche Compartido</span>
                {isMasterUnlocked && (
                  <span className="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-1.5 py-0.5 rounded-md font-extrabold flex items-center gap-1">
                    <i className="fa-solid fa-crown text-[9px]"></i> MASTER
                  </span>
                )}
              </h1>
              <button 
                onClick={onOpenSettings}
                className="text-[10px] text-slate-400 font-medium hover:text-sky-300 flex items-center gap-1 transition-colors mt-0.5"
              >
                <span className={`w-1.5 h-1.5 rounded-full ${syncStatus === 'connected' ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                <span>Grupo: <strong className="text-slate-200 font-semibold">{groupCode}</strong></span>
                <i className="fa-solid fa-gear text-[9px] ml-0.5 text-sky-400"></i>
              </button>
            </div>
          </div>

          <div className="flex items-center gap-2">
            <button
              onClick={onToggleMaster}
              className={`px-2.5 py-1.5 rounded-xl border text-xs font-semibold transition-all flex items-center gap-1 ${
                isMasterUnlocked
                  ? 'bg-amber-500/20 border-amber-500/50 text-amber-300 shadow-sm'
                  : 'bg-slate-800 border-slate-700/80 text-slate-400 hover:text-slate-200'
              }`}
              title={isMasterUnlocked ? "Bloquear Modo Master" : "Activar Modo Master"}
            >
              <i className={`fa-solid ${isMasterUnlocked ? 'fa-lock-open text-amber-400' : 'fa-lock'}`}></i>
            </button>

            <button
              onClick={onShare}
              className="px-2.5 py-1.5 rounded-xl bg-emerald-600/20 border border-emerald-500/40 text-emerald-300 text-xs font-semibold hover:bg-emerald-600/30 transition-all flex items-center gap-1.5 active:scale-95 shadow-sm"
            >
              <i className="fa-brands fa-whatsapp text-sm"></i>
              <span>Compartir</span>
            </button>
          </div>
        </header>
      );
    };

    const SuggestionWidget = ({
      selectedDay,
      selectedSection,
      onSelectDay,
      onSelectSection,
      weeklyRoutines,
      getRecommendedDriverForGroup,
      onPrepareTrip,
      onOpenPlanner
    }) => {
      const key = `${selectedDay}_${selectedSection}`;
      const activeGroups = weeklyRoutines[key] || [];

      return (
        <div className="bg-gradient-to-br from-slate-900 via-slate-900 to-sky-950/40 rounded-2xl p-4 border border-sky-500/30 shadow-xl space-y-3">
          <div className="flex items-center justify-between border-b border-slate-800/80 pb-2.5">
            <span className="text-xs font-extrabold uppercase tracking-wider text-sky-400 flex items-center gap-1.5">
              <i className="fa-solid fa-wand-magic-sparkles"></i>
              Sugerencia de Viajes del Día
            </span>
            <span className="text-[10px] bg-sky-500/20 text-sky-300 px-2.5 py-0.5 rounded-full font-mono border border-sky-500/30">
              Rutinas
            </span>
          </div>

          <div className="flex items-center justify-between gap-2 bg-slate-950/80 p-2 rounded-xl border border-slate-800">
            <div className="flex items-center gap-1.5">
              <i className="fa-solid fa-calendar-day text-sky-400 text-xs pl-1"></i>
              <select
                value={selectedDay}
                onChange={(e) => onSelectDay(e.target.value)}
                className="bg-transparent text-xs font-bold text-slate-100 focus:outline-none cursor-pointer"
              >
                {DAYS_OF_WEEK.map(d => (
                  <option key={d} value={d} className="bg-slate-900 text-slate-100">{d}</option>
                ))}
              </select>
            </div>

            <div className="flex items-center gap-1 bg-slate-900 p-0.5 rounded-lg border border-slate-800">
              <button
                type="button"
                onClick={() => onSelectSection('Ida')}
                className={`px-2.5 py-1 text-[11px] font-bold rounded-md transition-all ${
                  selectedSection === 'Ida' ? 'bg-sky-500 text-white shadow' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                🌅 Ida
              </button>
              <button
                type="button"
                onClick={() => onSelectSection('Vuelta')}
                className={`px-2.5 py-1 text-[11px] font-bold rounded-md transition-all ${
                  selectedSection === 'Vuelta' ? 'bg-amber-500 text-white shadow' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                🌆 Vuelta
              </button>
            </div>
          </div>

          {activeGroups.length === 0 ? (
            <div className="p-3 bg-slate-950/60 rounded-xl text-center text-xs text-slate-500 border border-slate-800/50">
              No hay coches configurados para {selectedDay} ({selectedSection}).
              <button onClick={onOpenPlanner} className="block mx-auto mt-1 text-sky-400 underline font-semibold">
                Configurar en Agenda
              </button>
            </div>
          ) : (
            <div className="space-y-2.5">
              {activeGroups.map((grp, idx) => {
                const recommendedDriver = getRecommendedDriverForGroup(grp.members);
                const passengersList = grp.members.filter(m => m !== recommendedDriver);

                return (
                  <div key={grp.id || idx} className="p-3 bg-slate-950/90 border border-slate-800 rounded-xl space-y-2">
                    <div className="flex items-center justify-between">
                      <div className="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                        <i className="fa-solid fa-car-side text-amber-400"></i>
                        <span>{grp.name || `Coche ${idx + 1}`}</span>
                        <span className="text-[10px] text-slate-400 font-normal">({grp.members.length} pers.)</span>
                      </div>
                      {recommendedDriver && (
                        <span className="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-500/30 font-semibold">
                          Le toca a {recommendedDriver}
                        </span>
                      )}
                    </div>

                    <div className="flex flex-wrap gap-1 text-[11px]">
                      {grp.members.map(mName => (
                        <span
                          key={mName}
                          className={`px-2 py-0.5 rounded-md font-medium border ${
                            mName === recommendedDriver
                              ? 'bg-amber-500/20 text-amber-300 border-amber-500/40 font-bold'
                              : 'bg-slate-900 text-slate-300 border-slate-800'
                          }`}
                        >
                          {mName === recommendedDriver ? `🔑 ${mName} (Conductor)` : mName}
                        </span>
                      ))}
                    </div>

                    <button
                      onClick={() => onPrepareTrip(recommendedDriver, passengersList, selectedSection)}
                      className="w-full mt-1 bg-sky-600/20 hover:bg-sky-600/30 border border-sky-500/40 text-sky-300 hover:text-white text-xs font-bold py-1.5 rounded-lg transition-all flex items-center justify-center gap-1.5 active:scale-98"
                    >
                      <i className="fa-solid fa-circle-check text-xs"></i>
                      <span>Cargar este trayecto en Registro</span>
                    </button>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    };

    const BalanceTab = ({
      displayedMembers,
      showInactiveInBalance,
      setShowInactiveInBalance,
      stats,
      getStatusBadge,
      selectedDay,
      selectedSection,
      onSelectDay,
      onSelectSection,
      weeklyRoutines,
      getRecommendedDriverForGroup,
      onPrepareTrip,
      onOpenPlanner
    }) => {
      return (
        <div className="space-y-4">
          <SuggestionWidget
            selectedDay={selectedDay}
            selectedSection={selectedSection}
            onSelectDay={onSelectDay}
            onSelectSection={onSelectSection}
            weeklyRoutines={weeklyRoutines}
            getRecommendedDriverForGroup={getRecommendedDriverForGroup}
            onPrepareTrip={onPrepareTrip}
            onOpenPlanner={onOpenPlanner}
          />

          <div className="space-y-2">
            <div className="flex items-center justify-between">
              <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center justify-between w-full">
                <span>Puntos y Estado del Coche</span>
                <div className="flex items-center gap-1.5">
                  <button
                    type="button"
                    onClick={() => setShowInactiveInBalance(!showInactiveInBalance)}
                    className={`text-[10px] px-2.5 py-1 rounded-lg border font-semibold transition-all flex items-center gap-1 ${
                      showInactiveInBalance 
                        ? 'bg-sky-500/20 text-sky-300 border-sky-500/40' 
                        : 'bg-slate-800 text-slate-400 border-slate-700/80 hover:text-slate-200'
                    }`}
                  >
                    <i className={`fa-solid ${showInactiveInBalance ? 'fa-eye' : 'fa-eye-slash'}`}></i>
                    <span>{showInactiveInBalance ? 'Todos' : 'Solo activos'}</span>
                  </button>
                </div>
              </h2>
            </div>

            {displayedMembers.map(m => {
              const score = stats.balance[m.name] || 0;
              const badge = getStatusBadge(score);
              const driven = stats.drivenCounts[m.name] || 0;
              const pass = stats.passengerCounts[m.name] || 0;

              return (
                <div key={m.id} className={`bg-slate-900 rounded-2xl p-3.5 border transition-all ${m.active ? 'border-slate-800/80 shadow-md' : 'border-slate-900/60 opacity-60'}`}>
                  <div className="flex items-center justify-between mb-2">
                    <div className="flex items-center gap-2.5">
                      <div className={`w-8 h-8 rounded-xl ${m.color} flex items-center justify-center font-bold text-white shadow-md text-sm`}>
                        {m.name.charAt(0)}
                      </div>
                      <div>
                        <div className="font-bold text-sm text-slate-100 flex items-center gap-1.5">
                          {m.name}
                          {!m.active && (
                            <span className="text-[9px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-1.5 py-0.2 rounded font-mono">Pausado</span>
                          )}
                        </div>
                        <span className={`text-[10px] px-2 py-0.5 rounded-full border font-semibold inline-block ${badge.color}`}>
                          {badge.text}
                        </span>
                      </div>
                    </div>

                    <div className="text-right">
                      <div className={`text-xl font-black font-mono ${score > 0 ? 'text-emerald-400' : score < 0 ? 'text-rose-400' : 'text-slate-300'}`}>
                        {score > 0 ? `+${score}` : score} <span className="text-xs font-normal text-slate-400">pts</span>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800/60 text-[11px] text-slate-400">
                    <div className="flex items-center gap-1.5">
                      <i className="fa-solid fa-car text-sky-400"></i>
                      <span>Conductor: <strong className="text-slate-200">{driven}</strong> veces</span>
                    </div>
                    <div className="flex items-center gap-1.5">
                      <i className="fa-solid fa-user text-slate-400"></i>
                      <span>Pasajero: <strong className="text-slate-200">{pass}</strong> veces</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    const PlannerTab = ({
      weeklyRoutines,
      members,
      onAddGroup,
      onRemoveGroup,
      onToggleMemberInGroup
    }) => {
      return (
        <div className="space-y-4">
          <div className="bg-slate-900 rounded-2xl p-4 border border-slate-800 shadow-md space-y-3">
            <div className="flex items-center justify-between border-b border-slate-800/80 pb-2.5">
              <h2 className="text-sm font-bold text-slate-100 flex items-center gap-2">
                <i className="fa-solid fa-calendar-week text-sky-400"></i>
                Agenda de Rutinas Semanales
              </h2>
              <span className="text-[10px] text-amber-300 bg-amber-500/10 px-2 py-0.5 rounded-full border border-amber-500/30 font-semibold">
                Por subgrupos / parejas
              </span>
            </div>

            <p className="text-xs text-slate-400 leading-relaxed">
              Define quiénes viajan juntos cada día. Puedes configurar <strong>1 o varios coches por separado</strong> para cada tramo (Ida / Vuelta).
            </p>

            <div className="space-y-4">
              {DAYS_OF_WEEK.map(day => (
                <div key={day} className="bg-slate-950 p-3.5 rounded-xl border border-slate-800/80 space-y-3">
                  <div className="font-bold text-sm text-slate-100 flex items-center justify-between border-b border-slate-800/80 pb-2">
                    <span className="flex items-center gap-2 text-sky-300">
                      <i className="fa-solid fa-calendar-day"></i>
                      {day}
                    </span>
                  </div>

                  {['Ida', 'Vuelta'].map(tramo => {
                    const routineKey = `${day}_${tramo}`;
                    const groups = weeklyRoutines[routineKey] || [];

                    return (
                      <div key={tramo} className="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800/80 space-y-2">
                        <div className="flex items-center justify-between text-xs">
                          <span className={`font-bold px-2 py-0.5 rounded ${
                            tramo === 'Ida' ? 'bg-sky-500/20 text-sky-300' : 'bg-amber-500/20 text-amber-300'
                          }`}>
                            {tramo === 'Ida' ? '🌅 Tramo Ida' : '🌆 Tramo Vuelta'}
                          </span>

                          <button
                            type="button"
                            onClick={() => onAddGroup(routineKey)}
                            className="text-[10px] bg-slate-800 hover:bg-slate-700 text-sky-300 px-2 py-1 rounded-md border border-slate-700/80 flex items-center gap-1 font-semibold"
                          >
                            <i className="fa-solid fa-plus text-[9px]"></i>
                            <span>Añadir Coche</span>
                          </button>
                        </div>

                        {groups.length === 0 ? (
                          <p className="text-[11px] text-slate-500 italic py-1">Sin coches asignados.</p>
                        ) : (
                          <div className="space-y-2">
                            {groups.map((grp, gIdx) => (
                              <div key={grp.id || gIdx} className="bg-slate-950 p-2 rounded-lg border border-slate-800/90 space-y-1.5">
                                <div className="flex items-center justify-between text-xs font-semibold text-slate-300">
                                  <span className="flex items-center gap-1">
                                    <i className="fa-solid fa-car text-amber-400 text-[10px]"></i>
                                    {grp.name || `Coche ${gIdx + 1}`}
                                  </span>
                                  <button
                                    type="button"
                                    onClick={() => onRemoveGroup(routineKey, grp.id)}
                                    className="text-slate-500 hover:text-rose-400 p-1 transition-colors"
                                    title="Eliminar coche"
                                  >
                                    <i className="fa-solid fa-xmark"></i>
                                  </button>
                                </div>

                                <div className="flex flex-wrap gap-1 pt-1">
                                  {members.map(m => {
                                    const isInGroup = grp.members.includes(m.name);
                                    return (
                                      <button
                                        key={m.id}
                                        type="button"
                                        onClick={() => onToggleMemberInGroup(routineKey, grp.id, m.name)}
                                        className={`px-2 py-0.5 rounded text-[11px] font-medium border transition-all flex items-center gap-1 ${
                                          isInGroup
                                            ? 'bg-sky-500/20 text-sky-200 border-sky-500/40'
                                            : 'bg-slate-900 text-slate-600 border-slate-800 opacity-60'
                                        }`}
                                      >
                                        <span className={`w-1.5 h-1.5 rounded-full ${m.color}`}></span>
                                        <span>{m.name}</span>
                                      </button>
                                    );
                                  })}
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    const NewTripTab = ({
      tripDate,
      setTripDate,
      tripSection,
      setTripSection,
      driver,
      setDriver,
      passengers,
      activeMembers,
      onDriverChange,
      onTogglePassenger,
      onSaveTrip
    }) => {
      return (
        <form onSubmit={onSaveTrip} className="space-y-4">

              <h3 className="font-bold text-base text-slate-100">¿Restablecer Aplicación?</h3>
              <p className="text-xs text-slate-400">Se restaurarán los integrantes, rutinas y datos por defecto del grupo.</p>
            </div>

            <div className="grid grid-cols-2 gap-2 pt-1">
              <button
                onClick={onClose}
                className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs py-2.5 rounded-xl transition-all"
              >
                Cancelar
              </button>
              <button
                onClick={onConfirm}
                className="bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs py-2.5 rounded-xl shadow-lg transition-all"
              >
                Sí, Restablecer
              </button>
            </div>
          </div>
        </div>
      );
    };

    const BottomNav = ({ activeTab, setActiveTab }) => {
      const tabs = [
        { id: 'balance', label: 'Saldos', icon: 'fa-scale-balanced' },
        { id: 'new', label: 'Trayecto', icon: 'fa-circle-plus', highlight: true },
        { id: 'history', label: 'Historial', icon: 'fa-clock-rotate-left' },
        { id: 'settings', label: 'Ajustes', icon: 'fa-gear' }
      ];

      return (
        <nav className="glass-nav px-2 py-2 shrink-0">
          <div className="grid grid-cols-4 gap-1">
            {tabs.map(tab => {
              const isActive = activeTab === tab.id;
              return (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex flex-col items-center justify-center py-2 rounded-xl transition-all ${
                    isActive
                      ? 'text-sky-400 bg-sky-500/10 font-bold'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <i className={`fa-solid ${tab.icon} ${tab.highlight ? 'text-lg text-sky-400' : 'text-base'}`}></i>
                  <span className="text-[10px] mt-1">{tab.label}</span>
                </button>
              );
            })}
          </div>
        </nav>
      );
    };

    function App() {
      const [activeTab, setActiveTab] = useState('balance');
      const [settingsSubTab, setSettingsSubTab] = useState('config'); // 'members', 'planner', 'config'

      const [members, setMembers] = useState(() => {
        const saved = localStorage.getItem('coche_members_v6');
        return saved ? JSON.parse(saved) : INITIAL_MEMBERS;
      });
      const [trips, setTrips] = useState(() => {
        const saved = localStorage.getItem('coche_trips_v6');
        return saved ? JSON.parse(saved) : INITIAL_TRIPS;
      });

      const [weeklyRoutines, setWeeklyRoutines] = useState(() => {
        const saved = localStorage.getItem('coche_weekly_routines_v7');
        return saved ? JSON.parse(saved) : INITIAL_ROUTINES;
      });

      const getTodayName = () => {
        const dayIdx = new Date().getDay();
        const map = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
        const name = map[dayIdx];
        return DAYS_OF_WEEK.includes(name) ? name : 'Lunes';
      };

      const [selectedDaySuggestion, setSelectedDaySuggestion] = useState(getTodayName());
      const [selectedSectionSuggestion, setSelectedSectionSuggestion] = useState('Ida');

      // Admin / Master PIN State
      const [masterPin, setMasterPin] = useState(() => {
        return localStorage.getItem('coche_master_pin') || '1234';
      });
      const [isMasterUnlocked, setIsMasterUnlocked] = useState(false);
      const [showMasterModal, setShowMasterModal] = useState(false);
      const [showResetModal, setShowResetModal] = useState(false);
      const [pendingTripToDelete, setPendingTripToDelete] = useState(null);
      const [inputPin, setInputPin] = useState('');
      const [pinError, setPinError] = useState('');
      const [newPinInput, setNewPinInput] = useState('');

      // Group Sync State
      const [groupCode, setGroupCode] = useState(() => {
        return localStorage.getItem('coche_group_code') || 'equipo-coche-1';
      });
      const [tempGroupCode, setTempGroupCode] = useState('');
      const [syncStatus, setSyncStatus] = useState('local');
      const isRemoteUpdate = useRef(false);

      const [toast, setToast] = useState(null);
      const [showInactiveInBalance, setShowInactiveInBalance] = useState(false);

      // Form state for new trip
      const todayStr = new Date().toISOString().split('T')[0];
      const [tripDate, setTripDate] = useState(todayStr);
      const [tripSection, setTripSection] = useState('Ida');

      const activeMembers = useMemo(() => members.filter(m => m.active), [members]);

      const displayedBalanceMembers = useMemo(() => {
        return showInactiveInBalance ? members : members.filter(m => m.active);
      }, [members, showInactiveInBalance]);

      const [driver, setDriver] = useState(() => {
        return (activeMembers[0] && activeMembers[0].name) ? activeMembers[0].name : 'Aurora';
      });
      const [passengers, setPassengers] = useState(() => {
        return activeMembers.slice(1).map(m => m.name);
      });

      const [newMemberName, setNewMemberName] = useState('');

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3200);
      };

      useEffect(() => {
        localStorage.setItem('coche_members_v6', JSON.stringify(members));
        localStorage.setItem('coche_trips_v6', JSON.stringify(trips));
        localStorage.setItem('coche_weekly_routines_v7', JSON.stringify(weeklyRoutines));
        localStorage.setItem('coche_group_code', groupCode);
        localStorage.setItem('coche_master_pin', masterPin);
      }, [members, trips, weeklyRoutines, groupCode, masterPin]);

      // Firebase Sync
      useEffect(() => {
        if (!groupCode || !window.FirebaseSync || !window.FirebaseSync.isAvailable) {
          setSyncStatus('local');
          return;
        }

        setSyncStatus('syncing');
        const { db, doc, onSnapshot } = window.FirebaseSync;
        const cleanCode = groupCode.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
        const groupRef = doc(db, 'coche_groups', cleanCode);

        const unsubscribe = onSnapshot(groupRef, (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.data();
            isRemoteUpdate.current = true;
            if (data.members) setMembers(data.members);
            if (data.trips) setTrips(data.trips);
            if (data.weeklyRoutines) setWeeklyRoutines(data.weeklyRoutines);
            setSyncStatus('connected');
            setTimeout(() => { isRemoteUpdate.current = false; }, 300);
          } else {
            setSyncStatus('connected');
          }
        }, (err) => {
          console.warn("Sync error:", err);
          setSyncStatus('local');
        });

        return () => unsubscribe();
      }, [groupCode]);

      const pushToCloud = (updatedMembers, updatedTrips, updatedRoutines) => {
        if (isRemoteUpdate.current || !groupCode || !window.FirebaseSync || !window.FirebaseSync.isAvailable) return;
        
        const { db, doc, setDoc } = window.FirebaseSync;
        const cleanCode = groupCode.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
        const groupRef = doc(db, 'coche_groups', cleanCode);

        setDoc(groupRef, {
          members: updatedMembers || members,
          trips: updatedTrips || trips,
          weeklyRoutines: updatedRoutines || weeklyRoutines,
          updatedAt: new Date().toISOString()
        }, { merge: true }).catch(err => {
          console.warn("Cloud push error:", err);
        });
      };

      useEffect(() => {
        const activeNames = activeMembers.map(m => m.name);
        if (!activeNames.includes(driver) && activeNames.length > 0) {
          setDriver(activeNames[0]);
        }
        setPassengers(prev => prev.filter(p => activeNames.includes(p) && p !== driver));
      }, [members]);

      const stats = useMemo(() => {
        const balance = {};
        const drivenCounts = {};
        const passengerCounts = {};

        members.forEach(m => {
          balance[m.name] = 0;
          drivenCounts[m.name] = 0;
          passengerCounts[m.name] = 0;
        });

        trips.forEach(trip => {
          const d = trip.driver;
          const passList = trip.passengers || [];
          const numPass = passList.length;

          if (balance.hasOwnProperty(d)) {
            drivenCounts[d] = (drivenCounts[d] || 0) + 1;
            balance[d] = (balance[d] || 0) + numPass;
          }

          passList.forEach(p => {
            if (balance.hasOwnProperty(p)) {
              passengerCounts[p] = (passengerCounts[p] || 0) + 1;
              balance[p] = (balance[p] || 0) - 1;
            }
          });
        });

        return { balance, drivenCounts, passengerCounts };
      }, [trips, members]);

      const getStatusBadge = (score) => {
        if (score >= 4) return { text: "🏆 Conduce mucho (+)", color: "bg-emerald-500/20 text-emerald-300 border-emerald-500/40" };
        if (score >= 1) return { text: "✅ Al día (+)", color: "bg-teal-500/20 text-teal-300 border-teal-500/40" };
        if (score === 0) return { text: "⚖️ Saldado (0)", color: "bg-blue-500/20 text-blue-300 border-blue-500/40" };
        if (score >= -3) return { text: "🚘 Le toca pronto", color: "bg-amber-500/20 text-amber-300 border-amber-500/40" };
        return { text: "🚨 Le toca ¡YA!", color: "bg-rose-500/20 text-rose-300 border-rose-500/40" };
      };

      const getRecommendedDriverForGroup = (groupMemberList) => {
        const activeGroupMembers = groupMemberList.filter(name => {
          const m = members.find(mem => mem.name === name);
          return m && m.active;
        });

        if (activeGroupMembers.length === 0) return null;

        let candidates = [...activeGroupMembers];
        candidates.sort((a, b) => {
          const scoreA = stats.balance[a] || 0;
          const scoreB = stats.balance[b] || 0;
          if (scoreA !== scoreB) return scoreA - scoreB;
          return (stats.drivenCounts[a] || 0) - (stats.drivenCounts[b] || 0);
        });

        return candidates[0];
      };

      const handlePrepareTrip = (recDriver, passList, section) => {
        if (!recDriver) return showToast("⚠️ No hay integrantes disponibles en este grupo");
        setDriver(recDriver);
        setPassengers(passList);
        setTripSection(section);
        setActiveTab('new');
        showToast(`🚘 Trayecto preparado: ${recDriver} lleva a ${passList.join(', ')}`);
      };

      const handleAddGroupToRoutine = (routineKey) => {
        const currentGroups = weeklyRoutines[routineKey] || [];
        const newGroup = {
          id: 'r_' + Date.now(),
          name: `Coche ${currentGroups.length + 1}`,
          members: activeMembers.slice(0, 2).map(m => m.name)
        };
        const updated = {
          ...weeklyRoutines,
          [routineKey]: [...currentGroups, newGroup]
        };
        setWeeklyRoutines(updated);
        pushToCloud(members, trips, updated);
        showToast("🚗 Coche/Grupo añadido a la rutina");
      };

      const handleRemoveGroupFromRoutine = (routineKey, groupId) => {
        const currentGroups = weeklyRoutines[routineKey] || [];
        const updated = {
          ...weeklyRoutines,
          [routineKey]: currentGroups.filter(g => g.id !== groupId)
        };
        setWeeklyRoutines(updated);
        pushToCloud(members, trips, updated);
        showToast("🗑️ Coche eliminado de la rutina");
      };

      const handleToggleMemberInRoutineGroup = (routineKey, groupId, memberName) => {
        const currentGroups = weeklyRoutines[routineKey] || [];
        const updatedGroups = currentGroups.map(g => {
          if (g.id === groupId) {
            const has = g.members.includes(memberName);
            const newMembers = has ? g.members.filter(m => m !== memberName) : [...g.members, memberName];
            return { ...g, members: newMembers };
          }
          return g;
        });
        const updated = {
          ...weeklyRoutines,
          [routineKey]: updatedGroups
        };
        setWeeklyRoutines(updated);
        pushToCloud(members, trips, updated);
      };

      const handleAddMember = (e) => {
        e.preventDefault();
        const trimmed = newMemberName.trim();
        if (!trimmed) return;

        if (members.some(m => m.name.toLowerCase() === trimmed.toLowerCase())) {
          showToast("⚠️ Ya existe un integrante con ese nombre");
          return;
        }

        const colors = ['bg-blue-500', 'bg-emerald-500', 'bg-amber-500', 'bg-purple-500', 'bg-rose-500', 'bg-indigo-500', 'bg-teal-500'];
        const newObj = {
          id: 'm_' + Date.now(),
          name: trimmed,
          active: true,
          color: colors[members.length % colors.length]
        };

        const updated = [...members, newObj];
        setMembers(updated);
        setNewMemberName('');
        pushToCloud(updated, trips, weeklyRoutines);
        showToast(`👤 ${trimmed} añadido correctamente`);
      };

      const handleToggleMemberActive = (memberId) => {
        const updated = members.map(m => {
          if (m.id === memberId) return { ...m, active: !m.active };
          return m;
        });
        setMembers(updated);
        pushToCloud(updated, trips, weeklyRoutines);
        const target = members.find(m => m.id === memberId);
        if (target) {
          showToast(target.active ? `⏸️ ${target.name} puesto en pausa` : `🟢 ${target.name} activado`);
        }
      };

      const handleDeleteMember = (memberId, memberName) => {
        if (!isMasterUnlocked) {
          showToast("🔒 Requiere PIN MASTER para eliminar compañeros");
          setShowMasterModal(true);
          return;
        }
        const updated = members.filter(m => m.id !== memberId);
        setMembers(updated);
        pushToCloud(updated, trips, weeklyRoutines);
        showToast(`🗑️ ${memberName} eliminado del grupo`);
      };

      const handleDriverChange = (newDriver) => {
        setDriver(newDriver);
        setPassengers(prev => prev.filter(p => p !== newDriver));
      };

      const togglePassenger = (person) => {
        if (person === driver) return;
        if (passengers.includes(person)) {
          if (passengers.length <= 1) {
            showToast("⚠️ Debe haber al menos 1 pasajero");
            return;
          }
          setPassengers(passengers.filter(p => p !== person));
        } else {
          setPassengers([...passengers, person]);
        }
      };

      const handleSaveTrip = (e) => {
        e.preventDefault();
        if (!driver) return showToast("⚠️ Selecciona un conductor activo");
        if (passengers.length === 0) return showToast("⚠️ Selecciona al menos 1 pasajero");

        const newTripData = {
          id: 't_' + Date.now(),
          date: tripDate,
          section: tripSection,
          driver: driver,
          passengers: passengers,
          createdAt: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })
        };

        const updatedTrips = [newTripData, ...trips];
        setTrips(updatedTrips);
        pushToCloud(members, updatedTrips, weeklyRoutines);
        showToast("✅ Trayecto registrado correctamente");
        setActiveTab('balance');
      };

      const requestDeleteTrip = (tripId) => {
        if (isMasterUnlocked) {
          handleDeleteTrip(tripId);
        } else {
          setPendingTripToDelete(tripId);
          setInputPin('');
          setPinError('');
          setShowMasterModal(true);
        }
      };

      const handleVerifyMasterPin = (e) => {
        e.preventDefault();
        if (inputPin === masterPin) {
          setIsMasterUnlocked(true);
          setShowMasterModal(false);
          setPinError('');
          showToast("🔓 Modo MASTER activado");
          if (pendingTripToDelete) {
            handleDeleteTrip(pendingTripToDelete);
            setPendingTripToDelete(null);
          }
        } else {
          setPinError("❌ PIN incorrecto.");
        }
      };

      const handleChangeMasterPin = (e) => {
        e.preventDefault();
        const cleanPin = newPinInput.trim();
        if (cleanPin.length < 4) {
          showToast("⚠️ El PIN debe tener al menos 4 dígitos");
          return;
        }
        setMasterPin(cleanPin);
        setNewPinInput('');
        showToast("🔑 Nuevo PIN MASTER guardado correctamente");
      };

      const handleDeleteTrip = (id) => {
        const updated = trips.filter(t => t.id !== id);
        setTrips(updated);
        pushToCloud(members, updated, weeklyRoutines);
        showToast("🗑️ Trayecto eliminado");
      };

      const handleConnectGroup = () => {
        const sourceCode = tempGroupCode.trim() !== '' ? tempGroupCode : groupCode;
        const clean = sourceCode.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
        if (!clean) return showToast("⚠️ Escribe un código válido");
        setGroupCode(clean);
        setTempGroupCode('');
        showToast(`🔄 Conectado al grupo: ${clean}`);
      };

      const handleConfirmReset = () => {
        setMembers(INITIAL_MEMBERS);
        setTrips(INITIAL_TRIPS);
        setWeeklyRoutines(INITIAL_ROUTINES);
        pushToCloud(INITIAL_MEMBERS, INITIAL_TRIPS, INITIAL_ROUTINES);
        setShowResetModal(false);
        showToast("🔄 Datos reiniciados a los valores originales");
      };

      const exportToCSV = () => {
        let csvContent = "\uFEFF";
        csvContent += "RESUMEN DE TURNOS Y PUNTOS\n";
        csvContent += "Nombre,Estado,Puntos Turno,Viajes Como Conductor,Viajes Como Pasajero\n";
        
        members.forEach(m => {
          const score = stats.balance[m.name] || 0;
          const driven = stats.drivenCounts[m.name] || 0;
          const pass = stats.passengerCounts[m.name] || 0;
          const stateStr = m.active ? "Activo" : "Pausado";
          csvContent += `"${m.name}","${stateStr}",${score},${driven},${pass}\n`;
        });

        csvContent += "\n\nHISTORIAL DETALLADO DE TRAYECTOS\n";
        csvContent += "ID,Fecha,Tramo,Conductor,Pasajeros,Hora Registro\n";
        
        trips.forEach(t => {
          const passStr = (t.passengers || []).join('; ');
          csvContent += `"${t.id}","${t.date}","${t.section}","${t.driver}","${passStr}","${t.createdAt || ''}"\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `CocheCompartido_${groupCode}_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("📊 Informe descargado correctamente para Excel");
      };

      const copyWhatsAppSummary = () => {
        let msg = `🚗 *CONTROL COCHE COMPARTIDO*\n`;
        msg += `Grupo: *${groupCode}*\n\n`;
        
        members.forEach(m => {
          const score = stats.balance[m.name] || 0;
          const status = score >= 0 ? `+${score}` : `${score}`;
          const stateIcon = m.active ? '🟢' : '⏸️ (Pausado)';
          msg += `${stateIcon} *${m.name}*: ${status} pts (Puso coche ${stats.drivenCounts[m.name] || 0} veces)\n`;
        });

        const textArea = document.createElement("textarea");
        textArea.value = msg;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast("📋 Resumen copiado. ¡Pégalo en WhatsApp!");
        } catch (err) {
          showToast("⚠️ No se pudo copiar automáticamente");
        }
        document.body.removeChild(textArea);
      };

      return (
        <div className="flex flex-col h-full bg-slate-950 text-slate-100 overflow-hidden">
          <Toast message={toast} />

          <Header
            isMasterUnlocked={isMasterUnlocked}
            syncStatus={syncStatus}
            groupCode={groupCode}
            onOpenSettings={() => {
              setSettingsSubTab('config');
              setActiveTab('settings');
            }}
            onToggleMaster={() => {
              if (isMasterUnlocked) {
                setIsMasterUnlocked(false);
                showToast("🔒 Modo MASTER bloqueado");
              } else {
                setPendingTripToDelete(null);
                setInputPin('');
                setPinError('');
                setShowMasterModal(true);
              }
            }}
            onShare={copyWhatsAppSummary}
          />

          <main className="flex-1 overflow-y-auto p-4 space-y-4">
            {activeTab === 'balance' && (
              <BalanceTab
                displayedMembers={displayedBalanceMembers}
                showInactiveInBalance={showInactiveInBalance}
                setShowInactiveInBalance={setShowInactiveInBalance}
                stats={stats}
                getStatusBadge={getStatusBadge}
                selectedDay={selectedDaySuggestion}
                selectedSection={selectedSectionSuggestion}
                onSelectDay={setSelectedDaySuggestion}
                onSelectSection={setSelectedSectionSuggestion}
                weeklyRoutines={weeklyRoutines}
                getRecommendedDriverForGroup={getRecommendedDriverForGroup}
                onPrepareTrip={handlePrepareTrip}
                onOpenPlanner={() => {
                  setSettingsSubTab('planner');
                  setActiveTab('settings');
                }}
              />
            )}

            {activeTab === 'new' && (
              <NewTripTab
                tripDate={tripDate}
                setTripDate={setTripDate}
                tripSection={tripSection}
                setTripSection={setTripSection}
                driver={driver}
                setDriver={setDriver}
                passengers={passengers}
                activeMembers={activeMembers}
                onDriverChange={handleDriverChange}
                onTogglePassenger={togglePassenger}
                onSaveTrip={handleSaveTrip}
              />
            )}

            {activeTab === 'history' && (
              <HistoryTab
                trips={trips}
                isMasterUnlocked={isMasterUnlocked}
                onRequestDeleteTrip={requestDeleteTrip}
                onExportCSV={exportToCSV}
              />
            )}

            {activeTab === 'settings' && (
              <SettingsTab
                settingsSubTab={settingsSubTab}
                setSettingsSubTab={setSettingsSubTab}
                weeklyRoutines={weeklyRoutines}
                members={members}
                onAddGroup={handleAddGroupToRoutine}
                onRemoveGroup={handleRemoveGroupFromRoutine}
                onToggleMemberInGroup={handleToggleMemberInRoutineGroup}
                newMemberName={newMemberName}
                setNewMemberName={setNewMemberName}
                onAddMember={handleAddMember}
                onToggleMemberActive={handleToggleMemberActive}
                onDeleteMember={handleDeleteMember}
                stats={stats}
                syncStatus={syncStatus}
                tempGroupCode={tempGroupCode}
                setTempGroupCode={setTempGroupCode}
                groupCode={groupCode}
                onConnectGroup={handleConnectGroup}
                isMasterUnlocked={isMasterUnlocked}
                onToggleMaster={() => {
                  if (isMasterUnlocked) {
                    setIsMasterUnlocked(false);
                    showToast("🔒 Modo MASTER bloqueado");
                  } else {
                    setPendingTripToDelete(null);
                    setInputPin('');
                    setPinError('');
                    setShowMasterModal(true);
                  }
                }}
                masterPin={masterPin}
                newPinInput={newPinInput}
                setNewPinInput={setNewPinInput}
                onChangeMasterPin={handleChangeMasterPin}
                onExportCSV={exportToCSV}
                onCopyWhatsApp={copyWhatsAppSummary}
                onRequestReset={() => {
                  if (!isMasterUnlocked) {
                    showToast("🔒 Requiere PIN MASTER para reiniciar datos");
                    setShowMasterModal(true);
                  } else {
                    setShowResetModal(true);
                  }
                }}
              />
            )}
          </main>

          <MasterModal
            show={showMasterModal}
            inputPin={inputPin}
            setInputPin={setInputPin}
            pinError={pinError}
            onVerify={handleVerifyMasterPin}
            onClose={() => setShowMasterModal(false)}
          />

          <ResetModal
            show={showResetModal}
            onConfirm={handleConfirmReset}
            onClose={() => setShowResetModal(false)}
          />

          <BottomNav activeTab={activeTab} setActiveTab={setActiveTab} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
